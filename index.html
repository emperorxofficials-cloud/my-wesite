<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emperor's Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      background: #0a0a1a;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
    }

    p {
      color: #ccc;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      padding: 20px;
      margin: 15px;
      width: 260px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,255,204,0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0,255,204,0.5);
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #00ffcc;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    a:hover {
      background: #00ccaa;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

<canvas id="particles"></canvas>

<header>
  <h1>⚡ Emperor's Hub</h1>
  <p>Welcome to my official gaming & creator website</p>
</header>

<div class="container">

  <div class="card">
    <h2>💬 Discord Server</h2>
    <p>Join my community & chill</p>
    <a href="https://discord.gg/uyY3rvua" target="_blank">Join Discord</a>
  </div>

  <div class="card">
    <h2>📺 YouTube</h2>
    <p>Watch my gaming content</p>
    <a href="https://www.youtube.com/@Emperors_officials" target="_blank">Subscribe</a>
  </div>

  <div class="card">
    <h2>👤 About Me</h2>
    <p>Gaming creator, builder & dream chaser ⚡</p>
  </div>

</div>

<footer>
  © 2026 Emperor's Hub | Built with passion 🔥
</footer>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 3,
    dx: (Math.random() - 0.5),
    dy: (Math.random() - 0.5)
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ffcc";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
