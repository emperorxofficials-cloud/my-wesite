<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pirate Sea Battle 3D</title>
<style>
body { margin: 0; overflow: hidden; background: black; }
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-family: Arial;
}
</style>
</head>
<body>

<div id="ui">HP: <span id="hp">200</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x001a33);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10,10,10);
scene.add(light);

// PLAYER
let playerGeo = new THREE.BoxGeometry(1,1,1);
let playerMat = new THREE.MeshBasicMaterial({color: 0x00ffcc});
let player = new THREE.Mesh(playerGeo, playerMat);
scene.add(player);

// ENEMY
let enemies = [];
function spawnEnemy(x,z){
  let e = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshBasicMaterial({color: 0xff0000})
  );
  e.position.set(x,0,z);
  e.hp = 100;
  scene.add(e);
  enemies.push(e);
}

spawnEnemy(5,5);
spawnEnemy(-5,-10);
spawnEnemy(10,-8);

// GROUND (SEA)
let sea = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshBasicMaterial({color: 0x003366})
);
sea.rotation.x = -Math.PI/2;
scene.add(sea);

// CAMERA POSITION
camera.position.set(0,5,10);

let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let hp = 200;

// SHOOT
document.addEventListener("click", () => {
  enemies.forEach(e => {
    let dist = player.position.distanceTo(e.position);
    if(dist < 6){
      e.hp -= 20;
      if(e.hp <= 0){
        scene.remove(e);
      }
    }
  });
});

// MOVE LOOP
function update(){
  if(keys["w"]) player.position.z -= 0.2;
  if(keys["s"]) player.position.z += 0.2;
  if(keys["a"]) player.position.x -= 0.2;
  if(keys["d"]) player.position.x += 0.2;

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 8;
  camera.lookAt(player.position);

  // enemy AI
  enemies.forEach(e => {
    e.position.lerp(player.position, 0.005);

    if(e.position.distanceTo(player.position) < 1.5){
      hp -= 1;
      document.getElementById("hp").innerText = hp;
    }
  });
}

function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
