<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fruit RPG World</title>
<style>
body { margin:0; background:#0b1020; overflow:hidden; font-family:sans-serif; }
canvas { display:block; margin:0 auto; background:#1a2340; }

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
}

button { margin:5px; padding:8px; }
</style>
</head>
<body>

<div id="ui">
  <button onclick="attack()">Sword Attack</button>
  <button onclick="useSkill()">Fruit Skill</button>
  <div id="stats"></div>
</div>

<canvas id="game" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// PLAYER
const player = {
  x: 500,
  y: 300,
  hp: 200,
  speed: 3,
  level: 1,
  xp: 0
};

// ENEMIES
let enemies = [];

for (let i=0;i<10;i++){
  enemies.push({
    x: Math.random()*1000,
    y: Math.random()*600,
    hp: 100
  });
}

// ATTACK SYSTEM
function attack(){
  enemies.forEach(e=>{
    let dx = e.x - player.x;
    let dy = e.y - player.y;
    let dist = Math.hypot(dx,dy);

    if(dist < 60){
      e.hp -= 25; // sword damage
    }
  });
}

// FRUIT SKILL (AOE)
let skillCooldown = false;

function useSkill(){
  if(skillCooldown) return;

  skillCooldown = true;

  enemies.forEach(e=>{
    let dist = Math.hypot(e.x-player.x, e.y-player.y);
    if(dist < 150){
      e.hp -= 50; // fruit damage
    }
  });

  setTimeout(()=> skillCooldown=false, 2000);
}

// GAME LOOP
function loop(){

  ctx.clearRect(0,0,1000,600);

  // MOVE
  if(keys["w"]) player.y -= player.speed;
  if(keys["s"]) player.y += player.speed;
  if(keys["a"]) player.x -= player.speed;
  if(keys["d"]) player.x += player.speed;

  // DRAW PLAYER
  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.arc(player.x,player.y,10,0,Math.PI*2);
  ctx.fill();

  // ENEMIES AI
  enemies.forEach(e=>{
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    let dist = Math.hypot(dx,dy);

    e.x += dx/dist * 1.2;
    e.y += dy/dist * 1.2;

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(e.x,e.y,10,0,Math.PI*2);
    ctx.fill();

    if(dist < 15){
      player.hp -= 0.5;
    }

    // HP text
    ctx.fillStyle="white";
    ctx.fillText(e.hp, e.x-10, e.y-15);
  });

  // REMOVE DEAD
  enemies = enemies.filter(e=>e.hp>0);

  // LEVEL SYSTEM
  if(enemies.length === 0){
    player.level++;
    player.xp += 50;

    for(let i=0;i<10;i++){
      enemies.push({
        x: Math.random()*1000,
        y: Math.random()*600,
        hp: 100 + player.level*10
      });
    }
  }

  // UI
  document.getElementById("stats").innerHTML =
  `HP:${Math.floor(player.hp)} | Level:${player.level} | Enemies:${enemies.length}`;

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
